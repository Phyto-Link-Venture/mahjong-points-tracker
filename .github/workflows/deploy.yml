name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/mahjong-points-tracker
            git pull origin main
            docker build -t mahjong-backend ./backend
            docker stop mahjong-backend 2>/dev/null || true
            docker rm mahjong-backend 2>/dev/null || true
            docker run -d \
              --name mahjong-backend \
              --network tb-network \
              -p 3002:3002 \
              --env-file /etc/mahjong.env \
              --restart unless-stopped \
              mahjong-backend
            chown -R www-data:www-data /var/www/mahjong-points-tracker/
